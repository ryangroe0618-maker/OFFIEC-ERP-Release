name: Build Office ERP Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-office-erp-release.yml"
      - "release-trigger.txt"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout release repo
        uses: actions/checkout@v4

      - name: Download ERP source
        shell: pwsh
        run: |
          $zipPath = Join-Path $env:RUNNER_TEMP "erp-main.zip"
          $extractPath = Join-Path $env:RUNNER_TEMP "erp-main"
          Invoke-WebRequest `
            -Uri "https://github.com/ryangroe0618-maker/ERP/archive/refs/heads/main.zip" `
            -OutFile $zipPath `
            -Headers @{ "User-Agent" = "Office-ERP-Release-Builder" } `
            -TimeoutSec 300
          Expand-Archive -Path $zipPath -DestinationPath $extractPath -Force
          $source = Get-ChildItem -Path $extractPath -Directory | Select-Object -First 1
          if (-not $source) {
            throw "ERP source archive extract failed."
          }
          "ERP_SOURCE=$($source.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build Office ERP exe
        shell: cmd
        run: |
          cd /d "%ERP_SOURCE%\Office ERP Windows"
          python -m venv .venv
          ".venv\Scripts\python.exe" -m pip install --upgrade pip
          ".venv\Scripts\python.exe" -m pip install -r requirements-build.txt
          ".venv\Scripts\python.exe" -m PyInstaller ^
            --noconfirm ^
            --clean ^
            --onedir ^
            --windowed ^
            --name Office_ERP ^
            --hidden-import office_erp_bundle_imports ^
            --collect-all PySide6 ^
            --collect-all pandas ^
            --collect-all numpy ^
            --collect-all openpyxl ^
            --collect-all gspread ^
            --collect-all google ^
            --collect-all google_auth_oauthlib ^
            --collect-all pypdf ^
            --collect-all pymupdf ^
            --collect-all fitz ^
            "ERP 업무 런처.py"
          xcopy /E /I /Y "dist\Office_ERP" "."

      - name: Package release assets
        shell: pwsh
        run: |
          Set-Location (Join-Path $env:ERP_SOURCE "Office ERP Windows")
          $source = Get-Location
          $stage = Join-Path $env:RUNNER_TEMP "Office_ERP_Windows_EXE"
          $scriptStage = Join-Path $env:RUNNER_TEMP "Office_ERP_Update"
          $tag = "v$(Get-Date -Format 'yyyy.MM.dd').${{ github.run_number }}.${{ github.run_attempt }}"
          $exeAssetName = "Office_ERP_Windows_EXE_$tag.zip"
          $scriptAssetName = "Office_ERP_Update_$tag.zip"
          $manifestAssetName = "Office_ERP_UpdateManifest_$tag.json"
          $forceUpdaterAssetName = "ERP_Force_Update_$tag.cmd"
          $exeZip = Join-Path $env:RUNNER_TEMP $exeAssetName
          $scriptZip = Join-Path $env:RUNNER_TEMP $scriptAssetName
          $manifestPath = Join-Path $env:RUNNER_TEMP $manifestAssetName
          $forceUpdaterPath = Join-Path $env:RUNNER_TEMP $forceUpdaterAssetName

          "OFFICE_ERP_RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "OFFICE_ERP_EXE_ASSET_NAME=$exeAssetName" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "OFFICE_ERP_SCRIPT_ASSET_NAME=$scriptAssetName" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "OFFICE_ERP_MANIFEST_ASSET_NAME=$manifestAssetName" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "OFFICE_ERP_FORCE_UPDATER_ASSET_NAME=$forceUpdaterAssetName" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Get-ChildItem -Path $source -Force |
            Where-Object { $_.Name -notin @(".git", ".github", ".gitignore", ".venv", "build", "dist", "__pycache__", "배포") } |
            Copy-Item -Destination $stage -Recurse -Force
          Compress-Archive -Path $stage -DestinationPath $exeZip -Force

          New-Item -ItemType Directory -Force -Path $scriptStage | Out-Null
          foreach ($runtimeItem in @("scripts", "apps-script")) {
            $runtimePath = Join-Path $source $runtimeItem
            if (Test-Path $runtimePath) {
              Copy-Item -Path $runtimePath -Destination $scriptStage -Recurse -Force
            }
          }
          foreach ($runtimeFile in @("ERP 업무 런처.py", "업데이트_확인.ps1", "START_WINDOWS.cmd", "ERP_강제업데이트.cmd")) {
            $runtimePath = Join-Path $source $runtimeFile
            if (Test-Path $runtimePath) {
              Copy-Item -Path $runtimePath -Destination $scriptStage -Force
            }
          }
          Compress-Archive -Path $scriptStage -DestinationPath $scriptZip -Force

          $manifest = [ordered]@{
            version = $tag
            source_commit = "${{ github.sha }}"
            update_type = "exe"
            script_zip = $scriptAssetName
            exe_zip = $exeAssetName
            force_updater = $forceUpdaterAssetName
            changed_files = @("Office ERP Windows")
          }
          $manifest | ConvertTo-Json -Depth 5 | Out-File -FilePath $manifestPath -Encoding utf8
          Copy-Item -Path (Join-Path $source "ERP_강제업데이트.cmd") -Destination $forceUpdaterPath -Force

      - name: Publish latest release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:OFFICE_ERP_RELEASE_TAG
          $exeZip = Join-Path $env:RUNNER_TEMP $env:OFFICE_ERP_EXE_ASSET_NAME
          $scriptZip = Join-Path $env:RUNNER_TEMP $env:OFFICE_ERP_SCRIPT_ASSET_NAME
          $manifest = Join-Path $env:RUNNER_TEMP $env:OFFICE_ERP_MANIFEST_ASSET_NAME
          $forceUpdater = Join-Path $env:RUNNER_TEMP $env:OFFICE_ERP_FORCE_UPDATER_ASSET_NAME
          gh release create $tag $exeZip $scriptZip $manifest $forceUpdater `
            --title "Office ERP Windows $tag" `
            --notes "자동 빌드 버전: $tag`n소스 저장소: ryangroe0618-maker/ERP main" `
            --latest
